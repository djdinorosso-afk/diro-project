<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DiRo — Dino Rosso</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'" />
  <link rel="icon" href="logo.png" type="image/png" />
  <style>
    :root { --red: #CC2222; --gold: #F5A623; --bg: #1A1A1A; --text: #F5F5F5; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: Inter, Arial, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 28px; padding: 32px 16px;
    }
    .stage { perspective: 900px; }
    .coin {
      width: min(72vw, 320px); height: min(72vw, 320px);
      position: relative; transform-style: preserve-3d;
      animation: spin 8s linear infinite;
      filter: drop-shadow(0 0 28px rgba(245, 166, 35, 0.55));
    }
    .face {
      position: absolute; inset: 0; border-radius: 50%;
      background-size: cover; background-position: center;
      backface-visibility: hidden;
    }
    .front { background-image: url('front.png'); }
    .back { background-image: url('back.png'); transform: rotateY(180deg); }
    @keyframes spin {
      from { transform: rotateY(0deg); }
      to { transform: rotateY(360deg); }
    }
    h1 { margin: 0; font-size: clamp(36px, 8vw, 64px); letter-spacing: -0.04em; }
    h1 span.red { color: var(--red); }
    h1 span.gold { color: var(--gold); }
    p { margin: 0; color: #9CA3AF; text-align: center; max-width: 420px; }
    a.btn {
      display: inline-block; background: var(--red); color: #fff; text-decoration: none;
      font-weight: 700; padding: 12px 20px; border-radius: 8px;
    }
    code { color: var(--gold); word-break: break-all; font-size: 13px; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="coin" aria-label="DiRo coin">
      <div class="face front"></div>
      <div class="face back"></div>
    </div>
  </div>
  <h1><span class="red">DINO</span> <span class="gold">ROSSO</span></h1>
  <p>Токен DiRo на Polygon. Нажмите кнопку, чтобы добавить монету в MetaMask или Rabby с этим видом.</p>
  <code>0x5D1B6B802401866EE9B613B5f495F9eFb1017649</code>
  <a class="btn" href="add-token.html">Добавить DiRo в кошелёк</a>
</body>
</html>
