        let signer, userAddress, posw;
        const POLYGON_CHAIN_ID = '0x89'; // 137 в hex

        async function connectWallet() {
            if (!window.ethereum) {
                document.getElementById('log').innerText = '❌ Установите MetaMask и обновите страницу.';
                return;
            }
            try {
                await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: POLYGON_CHAIN_ID }] });
            } catch (switchError) {
                if (switchError.code === 4902) {
                    try {
                        await window.ethereum.request({
                            method: 'wallet_addEthereumChain',
                            params: [{
                                chainId: POLYGON_CHAIN_ID,
                                chainName: 'Polygon Mainnet',
                                nativeCurrency: { name: 'POL', symbol: 'POL', decimals: 18 },
                                rpcUrls: ['https://polygon-rpc.com'],
                                blockExplorerUrls: ['https://polygonscan.com/']
                            }]
                        });
                    } catch (addError) {
                        document.getElementById('log').innerText = '❌ Не удалось добавить сеть Polygon: ' + addError.message;
                        return;
                    }
                }
            }
            try {
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send('eth_requestAccounts', []);
                signer = provider.getSigner();
                userAddress = await signer.getAddress();
                document.getElementById('walletAddress').innerText = userAddress;
                posw = new ethers.Contract(POSW_ADDRESS, POSW_ABI, signer);
                document.getElementById('refreshBtn').disabled = false;
                document.getElementById('claimAllBtn').disabled = false;
                document.getElementById('log').innerText = '✅ Кошелёк подключён. Загружаю награды...';
                loadRewards(); // автоматически загружаем награды
            } catch (e) {
                document.getElementById('log').innerText = '❌ Ошибка подключения: ' + e.message;
            }
        }

        async function loadRewards() {
            if (!userAddress) { alert('Сначала подключите кошелёк'); return; }
            const log = document.getElementById('log');
            log.innerText = 'Загружаю награды из базы сервера...';
            try {
                const response = await fetch(`/rewards/${userAddress}`);
                if (!response.ok) throw new Error('Сервер недоступен');
                const rewards = await response.json();
                renderRewards(rewards);
                log.innerText = `Загружено ${rewards.length} наград из базы сервера.`;
            } catch (e) {
                log.innerText = 'Ошибка: ' + e.message + '. Убедитесь, что сервер запущен.';
            }
        }

        function renderRewards(rewards) {
            const tbody = document.querySelector('#rewardsTable tbody');
            tbody.innerHTML = '';
            if (!rewards || rewards.length === 0) {
                document.getElementById('rewardsTable').style.display = 'none';
                return;
            }
            rewards.forEach(r => {
                const engagement = parseInt(r.likes) + parseInt(r.reposts);
                const followers = parseInt(r.followers);
                let rewardEstimate = 0;
                if (engagement > 0 && followers >= 0) {
                    rewardEstimate = Math.floor(Math.sqrt(engagement * 1e18) * Math.log2(1 + followers) / 1e9) / 1e18;
                }
                // Показываем первые 20 символов postId + троеточие, полный виден при наведении
                const shortId = r.postId.slice(0, 20) + '...';
                const row = `<tr>
                    <td title="${r.postId}">${shortId}</td>
                    <td>${r.followers}</td>
                    <td>${r.likes}</td>
                    <td>${rewardEstimate.toFixed(4)} DiRo</td>
                    <td><button onclick="claimOne('${r.postId}')">Забрать</button></td>
                </tr>`;
                tbody.innerHTML += row;
            });
            document.getElementById('rewardsTable').style.display = 'table';
        }

        async function claimOne(postId) {
            if (!posw) return alert('Подключите кошелёк');
            try {
                document.getElementById('log').innerText = `Клеймлю ${postId}...`;
                const tx = await posw.claimReward(postId, { gasLimit: 300000 });
                await tx.wait();
                document.getElementById('log').innerText = '✅ Награда получена!';
                await fetch('/mark-claimed', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ postId }) });
                loadRewards();
            } catch (e) {
                document.getElementById('log').innerText = '❌ ' + e.message;
            }
        }

        async function claimAll() {
            if (!posw) return alert('Подключите кошелёк');
            const buttons = document.querySelectorAll('#rewardsTable tbody button');
            let success = 0;
            for (const btn of buttons) {
                const postId = btn.getAttribute('onclick').split("'")[1];
                try {
                    const tx = await posw.claimReward(postId, { gasLimit: 300000 });
                    await tx.wait();
                    success++;
                    await fetch('/mark-claimed', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ postId }) });
                } catch (e) { console.error(postId, e); }
            }
            document.getElementById('log').innerText = `Заклеймлено ${success} из ${buttons.length} наград.`;
            loadRewards();
        }
    </script>
